# Tooling config. Dev-only: none of this ships into TouchDesigner, and TD's
# bundled interpreter never reads it. See docs/STANDARDS.md 2.

# `ruff format` is deliberately NOT part of the gate. It is black-compatible and
# hardcodes exactly two spaces before a trailing comment, with no setting to
# change it, which collapses the aligned annotation column that STANDARDS.md 1.1
# tier 4 relies on to keep a why-comment next to the thing it explains. `ruff
# check` still enforces everything that matters: unused imports, undefined
# names, line length, import order, bugbear. Formatting is a review concern.

[tool.ruff]
# 95, not the default 88. The house style puts explanatory comments on the same
# line as the code they annotate (STANDARDS.md 1.1 tier 4); at 88 those comments
# wrap and the annotation stops lining up with what it annotates.
line-length = 95
target-version = "py311"
# reference/ is frozen provenance, not maintained code: it is the spike that
# produced every measurement in DESIGN.md 2, and its value is in being exactly
# what was run. Linting it would invite edits that break that guarantee.
exclude = ["reference"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports/names, undefined names
    "I",        # isort: deterministic import order
    "B",        # bugbear: mutable defaults, shadowed builtins, silent bugs
    "BLE",      # blind except. STANDARDS.md 2 allows `except Exception` in
                # exactly one place - the body of an Objective-C callback - so
                # this rule turns that from an honour-system rule into a
                # tool-enforced one: every instance must carry an explicit
                # `# noqa: BLE001` sitting next to its justification.
    "UP",       # pyupgrade: no legacy syntax
    "RUF",      # ruff's own checks
]
ignore = [
    # We use %-formatting throughout, matching reference/. It survives being
    # pasted into a TouchDesigner Text DAT next to TD's own %-heavy examples,
    # and the spike is the provenance for most of this code.
    "UP031", "UP032",
]

[tool.ruff.lint.per-file-ignores]
# The probe deliberately imports pyobjc inside a function, after mutating
# sys.path at runtime. That is the thing being tested, not an accident.
# TouchDesigner injects `op`, `me`, `textDAT`, `scriptCHOP` and friends into the
# namespace of any script it runs. They genuinely do not exist outside TD, so
# F821 is correct and unhelpful here: this file is only ever executed by
# TouchDesigner, and importing stand-ins would make it lie about its
# dependencies. Scoped to this one file rather than disabled globally, so a
# genuine typo in the package still fails.
"tools/td_setup_snippet.py" = ["F821"]
"tools/td_bridge.py" = ["F821"]
"tools/td_setup_osc.py" = ["F821"]
"tools/td_build_comp.py" = ["F821", "E402"]
"tools/td_add_derive.py" = ["F821"]
"tools/td_add_latches.py" = ["F821"]
"tools/td_verify_latches.py" = ["F821"]
"tools/td_add_filter.py" = ["F821"]
"tools/td_add_temporal.py" = ["F821"]
"tools/probe_m1_in_td.py" = [
    "E402",
    # The probe's entire purpose is to survive a failing stage and report which
    # one failed - it is a diagnostic run by hand when something is already
    # suspected to be wrong, and a stage that raises must not cost us the five
    # stages after it. Per-file rather than eight separate noqa comments, since
    # here it is the design of the file rather than an exception to it.
    "BLE001",
]

[tool.mypy]
python_version = "3.11"
strict = true
# Frozen dataclasses and NewType carry part of the contract the comments state
# (STANDARDS.md 1.3); showing the error code makes a violation greppable.
show_error_codes = true

[[tool.mypy.overrides]]
# pyobjc's modules are generated at import time and TD's `td`/`op` API does not
# exist outside TouchDesigner, so neither carries type information. Strict mode
# here would mean a `# type: ignore` on every native call - noise that hides the
# real annotations. The pure-Python core stays strict; these are the two places
# where the outside world is untyped by nature.
# NOTE the bare module names alongside "tools.*": tools/ has no __init__.py, so
# mypy identifies those files as top-level modules named after the file, and the
# dotted pattern never matched them. The M0 review found them being checked
# under full strict mode - 88 errors - i.e. effectively not checked at all.
module = ["visionhands.engine", "visionhands.td.*", "tools.*",
          "probe_m1_in_td", "record_fixture"]
disallow_untyped_calls = false
disallow_any_expr = false
ignore_missing_imports = true
# Relaxed for the same reason as the calls: these files are mostly pyobjc, whose
# selectors carry no type information, so annotating every local that holds an
# Objective-C object states nothing and reads as noise. The pure-Python core
# stays fully strict.
disallow_untyped_defs = false
disallow_incomplete_defs = false
# pyobjc's NSObject is untyped, so every delegate class is a subclass of Any.
# Forbidding that would forbid writing an AVFoundation delegate at all.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# The frameworks themselves, wherever they are imported from.
module = ["objc", "Vision", "Quartz", "AVFoundation", "CoreMedia",
          "CoreFoundation", "Foundation", "libdispatch", "cv2", "td"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["visionhands/tests"]
# Fail on an unraisable exception from a background thread. A test that silently
# swallows a worker-thread crash is worse than no test, and this whole design
# hinges on a worker thread behaving (DESIGN.md 4.2).
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
